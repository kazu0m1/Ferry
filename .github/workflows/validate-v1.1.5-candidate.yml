name: Validate Ferry v1.1.5 candidate

on:
  push:
    branches:
      - feature/v1.1.5-tab-sidebar

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Build Ferry
        shell: cmd
        run: Build.cmd
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: Ferry-v1.1.5-candidate
          path: Portable/
          if-no-files-found: error
