name: Validate final Ferry v1.2.1

on:
  push:
    branches:
      - feature/v1.2.1-todo-startup-focus

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Ferry.exe
        shell: cmd
        run: Build.cmd
      - name: Verify FileVersion
        shell: pwsh
        run: |
          $exe = "Portable\\Ferry.exe"
          if (-not (Test-Path $exe)) { throw "Ferry.exe not found." }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe))
          if ($info.FileVersion -ne "1.2.1.0") { throw "Unexpected FileVersion: $($info.FileVersion)" }
