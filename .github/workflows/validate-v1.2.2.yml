name: Validate Ferry same-folder duplicates
on:
  push:
    branches:
      - feature/v1.2.2-same-folder-duplicate
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Build Ferry.exe
        shell: cmd
        run: Build.cmd
      - name: Compile regression tests
        shell: cmd
        run: C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /nologo /target:exe /out:duplicates-tests.exe tests\SameFolderDuplicateTests.cs
      - name: Run Windows duplicate regression
        shell: pwsh
        run: |
          & .\duplicates-tests.exe ".\Portable\Ferry.exe"
          if ($LASTEXITCODE -ne 0) { throw "Duplicate regression failed: $LASTEXITCODE" }
