name: Validate Ferry v1.1.5 release branch

on:
  push:
    branches:
      - release/v1.1.5

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4

      - name: Build portable package
        shell: cmd
        run: Make-PortableRelease.cmd

      - name: Verify version and package
        shell: pwsh
        run: |
          $zip = "dist\Ferry-v1.1.5-win-portable.zip"
          if (-not (Test-Path $zip)) { throw "Release ZIP not found: $zip" }
          $exe = "Portable\Ferry.exe"
          if (-not (Test-Path $exe)) { throw "Ferry.exe not found." }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe))
          if ($info.FileVersion -ne "1.1.5.0") { throw "Unexpected FileVersion: $($info.FileVersion)" }
          Write-Host "Release branch package verified."

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Ferry-v1.1.5-release-candidate
          path: dist/Ferry-v1.1.5-win-portable.zip
          if-no-files-found: error
