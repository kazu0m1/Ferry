name: Validate Ferry v1.1.7 top-align candidate

on:
  push:
    branches:
      - feature/v1.1.7-back-focus-new-text
    paths:
      - .github/workflows/validate-v1.1.7-top-align.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: Build.cmd

      - name: Upload portable candidate
        uses: actions/upload-artifact@v4
        with:
          name: Ferry-v1.1.7-top-align-candidate
          path: Portable/
          if-no-files-found: error
